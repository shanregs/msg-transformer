# Kafka consumption route (Camel YAML DSL). Loaded from classpath:routes/ (camel.main.routes-include-pattern).
# A plain Kafka consumer with Camel's default offset handling (the Kafka client auto-commits offsets).
# Placeholders {{...}} come from application.yml.
#
#   kafka topic -> bean kafkaMessageHandler.handle   (parse, reference data, mapping, write or batch)
#
# The route starts only when sftr.kafka.enabled=true (kafka and both profiles). With sftr.ingest=spring-kafka
# also pass --camel.main.routes-include-pattern=classpath:routes/none so the two consumers do not both run.
- route:
    id: sftr-kafka-ingest
    autoStartup: "{{sftr.kafka.enabled}}"
    from:
      uri: "kafka:{{sftr.kafka.topic}}"
      parameters:
        brokers: "{{spring.kafka.bootstrap-servers}}"
        groupId: "{{spring.kafka.consumer.group-id}}"
        autoOffsetReset: "{{spring.kafka.consumer.auto-offset-reset}}"
      steps:
        - bean:
            ref: kafkaMessageHandler
            method: handle
