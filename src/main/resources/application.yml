spring:
  application:
    name: sftr-mapping-engine
  datasource:                         # local Postgres, database "sftr" (see samples/db)
    url: ${SFTR_DB_URL:jdbc:postgresql://localhost:5432/sftr}
    username: ${SFTR_DB_USER:postgres}
    password: ${SFTR_DB_PASSWORD:}    # set the environment variable SFTR_DB_PASSWORD; never commit a password
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none                  # the trade table belongs to another application; this one only reads it

server:
  port: 9090                          # 8080 is often taken by other applications

springdoc:                            # Swagger UI at /swagger-ui.html, OpenAPI document at /v3/api-docs
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

logging:
  level:
    com.bmo.sftr: INFO

sftr:
  mapping:
    config: classpath:mapper/sftr-field-mappings.json

  db:
    event: RECEIVED                   # only rows with this event are processed
    page-size: 500                    # rows fetched per query

  output:
    file: ./data/sftr-report.csv      # rows are appended, in the order the rows were read
    rollover: DAILY                   # DAILY: a new file each day (sftr-report-2026-10-16.csv); NONE: one file
    file-zone: Asia/Kolkata           # the time zone whose midnight starts a new day
    write-mode: COUNT                 # PER_RECORD: open, append, close per row | COUNT: batch of batch-size rows | INTERVAL: batch every batch-interval
    batch-size: 100                   # COUNT: write when this many rows are waiting (the last batch is written at the end of a run)
    batch-interval: 5m                # INTERVAL: write when the oldest waiting row is this old
    max-buffered-records: 1000        # safety cap on rows held in memory
    file-date:                        # optional ISO date; replaces today in the rows and the file names

  csv:
    delimiter: ","

  refdata:
    base-url: http://localhost:8089
    path: /ref-data/sftr
    connect-timeout: 2s
    read-timeout: 5s
    max-attempts: 3
    backoff: 200ms                    # attempt n waits n * backoff
    request-fields:                   # request JSON key -> input message field
      bmoLegalEntity: bmoLegalEntity
      counterpartyId: counterpartyId
      group_cd: group_cd
      delegated: delegated

  constants:
    values:                           # single literals
      submitterId: BMOLN9000003
      participantId: BMOLN9000003
      repCpCodeType: LEI
      natureOfRepCpDefault: F
      londonBranchCountry: GB
      refPathPartyLei: find_sftr_party.values.lei
      refPathPartyNature: find_sftr_party_sector.values.natureOfReportingCounterparty
      refPathPartySector: find_sftr_party_sector.values.sector
    lists:                            # lists of literals
      londonLegalEntityPrefixes: [LDNBB, LDN-]
    lookups:                          # code tables: result value -> codes that produce it
      cpSide:
        GIVE: [PO, DP, RP, TP, BP, BC, CLD, B, RPO]
        TAKE: [PI, DV, RV, TV, LP, LC, CLR, L, RPI]
