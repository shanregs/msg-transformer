# Both mode: consume from Kafka AND accept POST /api/test-message at the same time.
# Both go through the same pipeline, which handles one message at a time.
# Run with --spring.profiles.active=both   (change the port with --server.port=<port> if 8080 is busy)
spring:
  main:
    web-application-type: servlet
sftr:
  kafka:
    enabled: true
  rest:
    enabled: true
server:
  port: 8080
