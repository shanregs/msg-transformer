# REST mode: no Kafka. Messages are sent one at a time to POST /api/test-message, which runs the whole flow
# (reference data, mapping, write to the CSV). Handy for quick tests and debugging.
# Run with --spring.profiles.active=rest   (change the port with --server.port=<port> if 9090 is busy)
spring:
  main:
    web-application-type: servlet
sftr:
  kafka:
    enabled: false
  rest:
    enabled: true
server:
  port: 9090
